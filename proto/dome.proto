/**
 * Dome Control Service Protobuf Definition
 *
 * Defines the gRPC API for controlling observatory domes
 * (rotating domes and roll-off roofs).
 */
syntax = "proto3";

package astro_mount;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

service DomeService {
    rpc OpenDome(google.protobuf.Empty) returns (DomeResult);
    rpc CloseDome(google.protobuf.Empty) returns (DomeResult);
    rpc RotateDome(DomeRotateRequest) returns (DomeResult);
    rpc GetDomeStatus(google.protobuf.Empty) returns (DomeStatus);
    rpc ParkDome(google.protobuf.Empty) returns (DomeResult);
    rpc SetDomeSync(DomeSyncRequest) returns (google.protobuf.Empty);
}

enum DomeType {
    DOME_UNKNOWN = 0;
    DOME_TYPE_ROTATING = 1;
    DOME_TYPE_ROLLOFF = 2;
}

enum DomeState {
    DOME_CLOSED = 0;
    DOME_OPENING = 1;
    DOME_OPEN = 2;
    DOME_CLOSING = 3;
    DOME_ROTATING = 4;
    DOME_PARKED = 5;
    DOME_ERROR = 6;
    DOME_UNKNOWN_STATE = 7;
}

message DomeStatus {
    DomeType dome_type = 1;
    DomeState state = 2;
    double azimuth_deg = 3;
    double target_azimuth_deg = 4;
    bool can_rotate = 5;
    bool can_open = 6;
    bool shutter_open = 7;
    double aperture_deg = 8;
    bool parked = 9;
    bool sync_enabled = 10;
    double sync_offset_deg = 11;
    string error_message = 12;
    double home_azimuth_deg = 13;
    double park_azimuth_deg = 14;
}

message DomeRotateRequest {
    double azimuth_deg = 1;
    bool wait_for_completion = 2;
}

message DomeResult {
    bool success = 1;
    string message = 2;
    DomeState state = 3;
}

message DomeSyncRequest {
    bool enabled = 1;
    double offset_deg = 2;
}
